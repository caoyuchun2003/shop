name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            mini/package-lock.json
            admin/package-lock.json
      - name: Install & build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_URL}" ]; then
            echo "Missing Actions variable API_URL (CFC HTTPS base)"
            exit 1
          fi
          cd mini && npm ci && VITE_BASE=/ VITE_API_URL="$VITE_API_URL" npm run build
          cd ../admin && npm ci && VITE_BASE=/admin/ VITE_API_URL="$VITE_API_URL" npm run build
          mkdir -p ../dist-pages/admin
          cp -R ../mini/dist/. ../dist-pages/
          cp -R ../admin/dist/. ../dist-pages/admin/
          echo shop.yuchuntest.com > ../dist-pages/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
